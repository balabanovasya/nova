name: Deploy to Yandex Object Storage

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload site
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync . s3://${{ secrets.YC_BUCKET }} --endpoint-url https://storage.yandexcloud.net --delete --exclude ".git/*" --exclude ".github/*" --exclude "*.txt"
